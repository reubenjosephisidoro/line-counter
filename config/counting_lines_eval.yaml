# Note that every setting here was decided on each eval clip's study clip, 
# which is footage from the same original recording where an eval clip was cut. 
# Each study clip's time range falls outside that of its corresponding evaluation 
# clip, and the two do not overlap. This file is committed before any eval clip is 
# run and is not changed after results are seen.

# Conventions:
# - Each line is drawn left to right. Points are [x, y] in pixels.
# - Side A is always positive: "B --> A" is a positive crossing while "A --> B" 
#   a negative one. These labels come from DIR_LABELS in the code, so they are 
#   not repeated.
# - cooldown and track_buffer are not stored here. They are determined based on each
#   clip's frame rate so they cover the same time on every clip. cooldown is always 
#   1.2 seconds while and track_buffer is always 2.4 seconds.

